name: prism_tv
description: "PrismTV - Modern, cinematic Smart TV, mobile, and web live broadcast streaming platform with pure optical glassmorphism, 1080p DASH universal streaming, and D-pad remote navigation."
homepage: "https://github.com/TheGandabherunda/PrismTV"
repository: "https://github.com/TheGandabherunda/PrismTV"
issue_tracker: "https://github.com/TheGandabherunda/PrismTV/issues"

publish_to: 'none'

version: 1.0.2+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  http: ^1.6.0
  intl: ^0.20.3
  cached_network_image: ^4.0.6
  video_player: ^2.14.1
  palette_generator: ^0.3.3+4
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

dependency_overrides:
  video_player_android:
    path: ./packages/video_player_android
