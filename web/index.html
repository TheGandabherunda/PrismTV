<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <script>
    (function() {
      // Dynamically resolve base href so it works both at root (/) and under subpath (/prismTV/)
      var path = window.location.pathname;
      var base = document.querySelector('base');
      if (path.toLowerCase().indexOf('/prismtv') === 0) {
        if (base) base.setAttribute('href', '/prismTV/');
      } else if (base && base.getAttribute('href') === '$FLUTTER_BASE_HREF') {
        base.setAttribute('href', '/');
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PrismTV · High-Performance Smart TV & Live Broadcast Streaming Platform by TheGandabherunda.">

  <!-- Mobile & TV Web App -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PrismTV">
  <meta name="theme-color" content="#0A0C13">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- HLS.js Engine for Web Video Playback (Essential for Chrome / Edge) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <script>
    (function() {
      if (!window.Hls) return;
      var mediaProto = HTMLMediaElement.prototype;
      var originalSrcDesc = Object.getOwnPropertyDescriptor(mediaProto, 'src') ||
                            Object.getOwnPropertyDescriptor(HTMLVideoElement.prototype, 'src');
      var originalSet = originalSrcDesc ? originalSrcDesc.set : function(v) { this.setAttribute('src', v); };
      var originalGet = originalSrcDesc ? originalSrcDesc.get : function() { return this.getAttribute('src'); };
      var originalLoad = HTMLMediaElement.prototype.load;

      var hlsInstances = new WeakMap();

      // Guard video.load() so Flutter's load() does not abort an active Hls.js MediaSource
      HTMLVideoElement.prototype.load = function() {
        if (hlsInstances.has(this)) {
          return;
        }
        return originalLoad.call(this);
      };

      Object.defineProperty(HTMLVideoElement.prototype, 'src', {
        set: function(val) {
          var video = this;

          // 1. If val is a blob: URL, it is Hls.js setting the MediaSource blob on the video element!
          // We MUST NOT destroy Hls or intercept it.
          if (typeof val === 'string' && val.indexOf('blob:') === 0) {
            originalSet.call(video, val);
            return;
          }

          // 2. If changing stream or clearing, destroy previous Hls instance
          var oldHls = hlsInstances.get(video);
          if (oldHls) {
            oldHls.destroy();
            hlsInstances.delete(video);
          }

          if (!val) {
            originalSet.call(video, '');
            return;
          }

          var canNativePlay = video.canPlayType('application/vnd.apple.mpegurl');
          var isNativeSupported = canNativePlay === 'probably' || (canNativePlay === 'maybe' && !navigator.userAgent.includes('Chrome') && !navigator.userAgent.includes('Edg'));
          var isHlsSource = typeof val === 'string' && (val.includes('.m3u8') || val.includes('stream-proxy'));

          if (isHlsSource && !isNativeSupported && Hls.isSupported()) {
            console.log('[PrismTV] Attaching Hls.js to HTMLVideoElement for stream:', val);
            var hls = new Hls({
              enableWorker: true,
              lowLatencyMode: true,
              backBufferLength: 30,
              maxBufferLength: 30,
              maxMaxBufferLength: 60,
            });
            hlsInstances.set(video, hls);

            hls.loadSource(val);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function() {
              console.log('[PrismTV] Hls manifest parsed successfully. Starting playback...');
              video.play().catch(function(e) {
                console.log('[PrismTV] Autoplay notice:', e);
              });
            });

            hls.on(Hls.Events.ERROR, function(event, data) {
              if (data.fatal) {
                switch(data.type) {
                  case Hls.ErrorTypes.NETWORK_ERROR:
                    console.warn('[PrismTV Hls Network Error] Recovering...', data.details);
                    hls.startLoad();
                    break;
                  case Hls.ErrorTypes.MEDIA_ERROR:
                    console.warn('[PrismTV Hls Media Error] Recovering...', data.details);
                    hls.recoverMediaError();
                    break;
                  default:
                    console.error('[PrismTV Hls Fatal Error]', data.details);
                    hls.destroy();
                    hlsInstances.delete(video);
                    break;
                }
              }
            });
          } else {
            originalSet.call(video, val);
          }
        },
        get: function() {
          return originalGet.call(this);
        },
        configurable: true,
        enumerable: true,
      });
      console.log('[PrismTV] Hls.js Media Source bridge loaded.');
    })();
  </script>

  <title>PrismTV · TheGandabherunda</title>
  <link rel="manifest" href="manifest.json">

    body {
      background-color: #0A0C13;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
