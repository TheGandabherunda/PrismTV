  <script>
    // Immediate Cache-Buster & Service Worker Purge (Ensures fresh builds always load without stale cache)
    (function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        });
      }
    })();
  </script>
  <script>
    (function() {
      // Dynamically resolve base href so it works both at root (/) and under subpath (/prismTV/)
      var path = window.location.pathname;
      var base = document.querySelector('base');
      if (path.toLowerCase().indexOf('/prismtv') === 0) {
        if (base) base.setAttribute('href', '/prismTV/');
      } else if (base && base.getAttribute('href') === '$FLUTTER_BASE_HREF') {
        base.setAttribute('href', '/');
      }
    })();
  </script>

  <!-- HLS.js & Shaka Player Video Engines (Essential for 1080p Broadpeak HLS & Widevine DASH) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.compiled.js"></script>
  <script>
    (function() {
      if (window.shaka) {
        shaka.polyfill.installAll();
      }

      var mediaProto = HTMLMediaElement.prototype;
      var originalSrcDesc = Object.getOwnPropertyDescriptor(mediaProto, 'src') ||
                            Object.getOwnPropertyDescriptor(HTMLVideoElement.prototype, 'src');
      var originalSet = originalSrcDesc ? originalSrcDesc.set : function(v) { this.setAttribute('src', v); };
      var originalGet = originalSrcDesc ? originalSrcDesc.get : function() { return this.getAttribute('src'); };
      var originalLoad = HTMLMediaElement.prototype.load;

      var hlsInstances = new WeakMap();
      var shakaInstances = new WeakMap();

      // Guard video.load() so Flutter's load() does not abort an active MediaSource
      HTMLVideoElement.prototype.load = function() {
        if (hlsInstances.has(this) || shakaInstances.has(this)) {
          return;
        }
        return originalLoad.call(this);
      };

      Object.defineProperty(HTMLVideoElement.prototype, 'src', {
        set: function(val) {
          var video = this;

          // 1. If val is a blob: URL, it is Hls.js or Shaka setting the MediaSource blob on the video element!
          if (typeof val === 'string' && val.indexOf('blob:') === 0) {
            originalSet.call(video, val);
            return;
          }

          // 2. If changing stream or clearing, destroy previous instances
          var oldHls = hlsInstances.get(video);
          if (oldHls) {
            oldHls.destroy();
            hlsInstances.delete(video);
            window.prismHls = null;
          }
          var oldShaka = shakaInstances.get(video);
          if (oldShaka) {
            oldShaka.destroy();
            shakaInstances.delete(video);
            window.prismShaka = null;
          }

          if (!val) {
            originalSet.call(video, '');
            return;
          }

          var isMpdSource = typeof val === 'string' && (val.indexOf('.mpd') !== -1 || val.indexOf('format=mpd') !== -1);
          var isHlsSource = typeof val === 'string' && (val.indexOf('.m3u8') !== -1 || val.indexOf('stream-proxy') !== -1);

          // Handle MPEG-DASH with Shaka Player
          if (isMpdSource && window.shaka && shaka.Player.isBrowserSupported()) {
            console.log('[PrismTV] Attaching Shaka Player to HTMLVideoElement for DASH stream:', val);
            var player = new shaka.Player(video);
            shakaInstances.set(video, player);
            window.prismShaka = player;

            var drmConfig = {};
            try {
              var u = new URL(val, window.location.origin);
              var chId = u.searchParams.get('channel_id') || '';
              var drmKey = u.searchParams.get('drm_key') || '';
              if (drmKey) {
                var prefix = window.location.pathname.toLowerCase().indexOf('/prismtv') === 0 ? '/prismTV' : '';
                drmConfig = {
                  servers: {
                    'com.widevine.alpha': prefix + '/api/drm-proxy?' + (chId ? 'channel_id=' + chId + '&' : '') + 'url=' + encodeURIComponent(drmKey)
                  },
                  advanced: {
                    'com.widevine.alpha': {
                      videoRobustness: 'SW_SECURE_CRYPTO',
                      audioRobustness: 'SW_SECURE_CRYPTO'
                    }
                  }
                };
              }
            } catch (_) {}

            var prefix = window.location.pathname.toLowerCase().indexOf('/prismtv') === 0 ? '/prismTV' : '';
            player.configure({
              drm: drmConfig,
              manifest: {
                dash: {
                  clockSyncUri: prefix + '/api/dashtime'
                }
              },
              abr: {
                enabled: true,
                defaultBandwidthEstimate: 10000000
              },
              streaming: {
                bufferingGoal: 6,
                rebufferingGoal: 2,
                bufferBehind: 5,
                retryParameters: {
                  maxAttempts: 3,
                  backoffFactor: 2,
                  timeout: 20000
                }
              }
            });

            player.load(val).then(function() {
              console.log('[PrismTV] Shaka live stream loaded in pristine 1080p Full HD with synchronized audio.');
              video.play().catch(function(e) {
                console.log('[PrismTV] Autoplay notice:', e);
              });
            }).catch(function(err) {
              console.error('[PrismTV] Shaka load error:', err);
            });
            return;
          }

          // Handle HLS with Hls.js
          var canNativePlay = video.canPlayType('application/vnd.apple.mpegurl');
          var isNativeSupported = canNativePlay === 'probably' || (canNativePlay === 'maybe' && !navigator.userAgent.includes('Chrome') && !navigator.userAgent.includes('Edg'));

          if (isHlsSource && !isNativeSupported && window.Hls && Hls.isSupported()) {
            console.log('[PrismTV] Attaching Hls.js to HTMLVideoElement for stream:', val);
            var hls = new Hls({
              enableWorker: true,
              lowLatencyMode: true,
              capLevelToPlayerSize: false,
              abrEwmaDefaultEstimate: 8000000,
              startLevel: -1,
              backBufferLength: 30,
              maxBufferLength: 45,
              maxMaxBufferLength: 90,
            });
            hlsInstances.set(video, hls);
            window.prismHls = hls;

            hls.loadSource(val);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function() {
              console.log('[PrismTV] Hls manifest parsed. Levels:', (hls.levels || []).map(function(l) { return l.height + 'p (' + Math.round(l.bitrate / 1000) + 'kbps)'; }));
              
              if (window.prismPreferredQualityHeight && window.prismPreferredQualityHeight > 0) {
                window.prismSetQuality(window.prismPreferredQualityHeight);
              } else if (hls.levels && hls.levels.length > 0) {
                var maxIdx = 0;
                for (var i = 1; i < hls.levels.length; i++) {
                  if ((hls.levels[i].height || 0) > (hls.levels[maxIdx].height || 0)) {
                    maxIdx = i;
                  }
                }
                hls.currentLevel = maxIdx;
                console.log('[PrismTV] Selected highest level automatically: Level', maxIdx, '(' + (hls.levels[maxIdx].height || 'HD') + 'p)');
              }

              video.play().catch(function(e) {
                console.log('[PrismTV] Autoplay notice:', e);
              });
            });

            hls.on(Hls.Events.ERROR, function(event, data) {
              if (data.fatal) {
                switch(data.type) {
                  case Hls.ErrorTypes.NETWORK_ERROR:
                    console.warn('[PrismTV Hls Network Error] Recovering...', data.details);
                    hls.startLoad();
                    break;
                  case Hls.ErrorTypes.MEDIA_ERROR:
                    console.warn('[PrismTV Hls Media Error] Recovering...', data.details);
                    hls.recoverMediaError();
                    break;
                  default:
                    console.error('[PrismTV Hls Fatal Error]', data.details);
                    hls.destroy();
                    hlsInstances.delete(video);
                    break;
                }
              }
            });
          } else {
            originalSet.call(video, val);
          }
        },
        get: function() {
          return originalGet.call(this);
        },
        configurable: true,
        enumerable: true,
      });

      window.prismSetQuality = function(targetHeight) {
        if (window.prismShaka) {
          var player = window.prismShaka;
          if (!targetHeight || targetHeight <= 0) {
            player.configure({
              abr: {
                enabled: true,
                restrictions: { minHeight: 0, maxHeight: 1080 }
              }
            });
            console.log('[PrismTV Shaka] Quality set to Auto');
            return true;
          }
          var tracks = player.getVariantTracks() || [];
          var heights = tracks.map(function(t) { return t.height || 0; }).filter(function(h) { return h > 0; });
          var maxH = heights.length > 0 ? Math.max.apply(null, heights) : 1080;
          var effectiveH = Math.min(targetHeight, maxH);
          player.configure({
            abr: {
              enabled: true,
              restrictions: {
                minHeight: effectiveH,
                maxHeight: effectiveH
              }
            }
          });
          console.log('[PrismTV Shaka] Video quality locked to ' + effectiveH + 'p without buffer flush (audio preserved)');
          return true;
        }

        if (window.prismHls) {
          var hls = window.prismHls;
          if (!targetHeight || targetHeight <= 0) {
            hls.currentLevel = -1;
            console.log('[PrismTV Hls] Quality set to Auto (ABR mode)');
            return true;
          }
          var levels = hls.levels || [];
          var bestIdx = -1;
          var minDiff = 999999;
          for (var i = 0; i < levels.length; i++) {
            var h = levels[i].height;
            if (h === targetHeight) {
              bestIdx = i;
              break;
            }
            var diff = Math.abs((h || 0) - targetHeight);
            if (diff < minDiff) {
              minDiff = diff;
              bestIdx = i;
            }
          }
          if (bestIdx !== -1) {
            hls.currentLevel = bestIdx;
            console.log('[PrismTV Hls] Locked quality to level ' + bestIdx + ' (' + (levels[bestIdx] ? levels[bestIdx].height : targetHeight) + 'p)');
            return true;
          }
        }

        return false;
      };

      console.log('[PrismTV] Hls.js & Shaka Player Media Source bridges loaded.');
    })();
  </script>
