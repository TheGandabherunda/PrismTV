name: CI & Build Android Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'ci-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  test_and_build:
    name: Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

      - name: Build Android Universal Release APK
        run: flutter build apk --release

      - name: Upload Android TV & Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismTV-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

